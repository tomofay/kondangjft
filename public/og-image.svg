    <path d="M22.5 34.875V46.125C22.5 50.625 28.575 54 36 54C43.425 54 49.5 50.625 49.5 46.125V34.875L36 41.625L22.5 34.875Z" fill="#ffffff" opacity="0.9"/>
    <path d="M58.5 30.375V43.875" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
